@font-face{font-family:"Cambria Latin";src:local("Cambria Italic"),local("Cambria-Italic"),url(fonts/Caladea-Italic.ttf) format("truetype");font-weight:400;font-style:italic;font-display:swap;unicode-range:U+0000-024F,U+2000-206F,U+20AC,U+2122}

.on{opacity:1}

   every lesson number badge has the same shape (rounded square, outline, dark-green number); tier tint stays as background. */

   /* phones: readings on one line, then the 訓/音 tag, keyword and speaker on the line below */

 body{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,38%);grid-template-rows:auto minmax(0,1fr);grid-auto-rows:0;padding-left:env(safe-area-inset-left);padding-right:calc(10px + env(safe-area-inset-right))}

}

<style id="v15-ui-css">
/*
 * v15 screens (Placement, Level check, Unit test, Practice) — styles for v15-ui.js.
 * Ported from kanji-data/prototype/proto.css. Uses the app's own tokens (--ui, --mincho, --matcha, --ink …) and
 * classes (.lend, .lcard, .lb, .ib.wide, .tier.*, .segs/.seg). New classes are prefixed v15- to avoid collisions.
 */

/* overlay: reuses .lend (fixed, fades in with .show); scrolls, starts at the top */
:root { --v15-bar-h: 76px; }   /* bottom bar: 56px button row + 2 × 10px padding */
#v15.lend { z-index: 50; align-items: flex-start; overflow-y: auto; background: var(--paper); padding: 16px 0 calc(var(--v15-bar-h) + 24px + env(safe-area-inset-bottom)); }
#v15.lend:not(.show) { display: none; }
#v15 .lcard.v15-card { width: min(94vw, 520px); text-align: left; margin: 0 auto; }
@media (max-width: 419px) { #v15 .lcard.v15-card { padding: 20px 16px; } }
#v15 h1 { font: 600 22px var(--ui); margin: 0 0 12px; color: var(--ink); }
#v15 h1 .ja { margin-right: 8px; }
#v15 p { font: 400 16px/1.5 var(--ui); margin: 0 0 12px; color: var(--ink); }
#v15 .v15-muted { color: var(--muted); }
#v15 .v15-small { font-size: 13px; }
#v15 .v15-headline { font: 700 28px/1.2 var(--ui); margin: 4px 0 6px; }
#v15 .v15-score { font: 600 20px var(--ui); margin: 0 0 4px; }

.v15-top { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.v15-top .v15-count { font: 400 13px var(--ui); color: var(--muted); }
.v15-banner { font: 600 15px var(--ui); color: var(--ink); background: #eef2e6; border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; }
.v15-banner.miss { background: #fdf0f2; font-weight: 400; }

.v15-char { font: 400 96px/1.1 var(--mincho); text-align: center; margin: 8px 0; color: var(--ink); }
.v15-word { font: 400 64px/1.15 var(--mincho); text-align: center; margin: 8px 0 4px; color: var(--ink); word-break: keep-all; }
.v15-word u { text-decoration-thickness: 3px; text-underline-offset: 8px; text-decoration-color: var(--verm); }
.v15-gloss { font: 400 15px var(--ui); color: var(--muted); text-align: center; margin-bottom: 12px; }
.v15-ask { text-align: center; }
@media (max-width: 399px) { .v15-char { font-size: 72px; } .v15-word { font-size: 52px; } }

/* choices: full-width 52px rows */
.v15-choices { display: flex; flex-direction: column; gap: 8px; }
.v15-choice {
  min-height: 52px; width: 100%; border: none; border-radius: 14px; background: #f3f1e6; color: #1a1a1a;
  font: 500 20px var(--ui); text-align: left; padding: 0 16px; cursor: pointer; display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
}
.v15-choice.picked { box-shadow: inset 0 0 0 2px var(--indigo); background: #eef2e6; }
.v15-choice.right { background: var(--matcha); }
.v15-choice.wrong { box-shadow: inset 0 0 0 2px var(--err); background: #fff; }
.v15-choice .tag { font: 600 13px var(--ui); }
.v15-choice.idk { font-size: 16px; }

.v15-input { width: 100%; min-height: 52px; font: 400 22px var(--ui); border: 1.5px solid #d8d4c8; border-radius: 14px; padding: 0 14px; background: #fff; color: var(--ink); }
.v15-feedback { min-height: 24px; font: 400 16px var(--ui); margin: 10px 0 0; }
.v15-feedback.ok { color: var(--indigo); font-weight: 600; }
.v15-feedback .also { color: var(--muted); font-size: 13px; }

/* fixed bottom bar (at most 2 buttons side by side) */
.v15-bar {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 51;
  display: flex;
  justify-content: center;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--paper);                    /* U2: opaque, content no longer shows through */
  box-shadow: 0 -1px 0 rgba(60, 50, 30, .10), 0 -8px 16px -12px rgba(60, 50, 30, .25);
}
.v15-bar .lb { margin-top: 0; width: min(94vw, 520px); flex-wrap: nowrap; justify-content: center; }
.v15-bar .lb button { flex: 1 1 160px; min-width: 160px; max-width: 260px; }   /* U2: spec §5.1, each ≥160px at 375 */
/* U2: disabled stays legible (muted, not faded) */
.v15-bar .lb button:disabled {
  opacity: 1;
  cursor: not-allowed;
  background: #ece8de;
  color: #6b6658;
  box-shadow: inset 0 0 0 1px rgba(35, 38, 31, .14);
}

/* rank badge pill (spec §1) */
.v15-badge { display: inline-flex; align-items: center; height: 28px; border-radius: 14px; padding: 0 10px; font: 600 13px var(--ui); color: #1a1a1a; background: #f3f1e6; box-shadow: inset 0 0 0 1px rgba(35, 38, 31, .12); white-space: nowrap; }
.v15-change { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.v15-change .to { font: 600 16px system-ui, sans-serif; color: var(--muted); }

/* kanji chips 44px with tier tint */
.v15-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.v15-chip { position: relative; width: 44px; height: 44px; border-radius: 12px; border: none; background: #f3f1e6; color: #1a1a1a; font: 400 22px var(--mincho); display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(35, 38, 31, .08); padding: 0; flex: none; }
button.v15-chip { cursor: pointer; }
.v15-chip.sel { box-shadow: inset 0 0 0 2.5px var(--indigo); }
.v15-chip .new { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--verm); }
.v15-grid { content-visibility: auto; contain-intrinsic-size: auto 600px; }

/* rows 52px */
.v15-rows { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.v15-row { min-height: 52px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 4px 12px; border: none; border-radius: 14px; background: #f7f5ee; color: #1a1a1a; text-align: left; font: 500 15px var(--ui); }
button.v15-row { cursor: pointer; }
.v15-row .grow { flex: 1 1 auto; min-width: 0; }
.v15-row .kanjis { display: block; font: 400 18px var(--mincho); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v15-group { font: 600 15px var(--ui); margin: 16px 0 4px; }

/* level tabs, pills, segmented control (44px) */
.v15-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 12px; }
.v15-tabs button, .v15-pill { min-height: 44px; border: none; border-radius: 12px; background: #f3f1e6; color: #1a1a1a; font: 600 15px var(--ui); cursor: pointer; }
.v15-tabs button.on, .v15-pill.on { background: var(--matcha); box-shadow: inset 0 0 0 1.5px rgba(93, 113, 72, .25); }
.v15-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.v15-pill { padding: 0 14px; min-width: 44px; }
.v15-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #f3f1e6; border-radius: 14px; padding: 4px; margin: 4px 0 12px; }
.v15-seg button { min-height: 44px; border: none; border-radius: 11px; background: transparent; font: 600 15px var(--ui); color: #1a1a1a; cursor: pointer; }
.v15-seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(60, 50, 30, .15); }
.v15-filter { display: flex; align-items: center; min-height: 52px; border-radius: 14px; background: #f7f5ee; padding: 0 12px; margin-bottom: 8px; }
.v15-filter label { font: 500 15px var(--ui); flex: none; margin-right: 8px; }
.v15-filter select { flex: 1 1 auto; min-width: 0; min-height: 44px; border: none; background: transparent; font: 600 15px var(--ui); color: #1a1a1a; text-align: right; }

/* unit picker: rows come first in the DOM (so "Unit 1" is the first match for keyboard/AT order), tabs shown on top */
.v15-units { display: flex; flex-direction: column; }
.v15-tabs button[data-level]::before { content: attr(data-level); }   /* visible label; the name is aria-label */

/* menu in the picker, under the level bar */
.klist .v15-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 10px; }
/* always 2 columns: the picker panel stays narrow at every viewport width */
.klist .v15-menu button { position: relative; width: 100%; min-width: 0; min-height: 52px; }
.klist .v15-menu .v15-mbadge { display: contents; }
.klist .v15-menu button b {
  position: absolute;
  top: 6px;
  right: 6px;                                  /* U1: same inset on both sides, so it sits in the corner */
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  font: 700 11px/1 var(--ui);
  background: #fdf0f2;
  color: #1a1a1a;
}

/* quit button on question screens */
#v15 .v15-quit { margin: 0 0 8px; }

/* "I wrote it correctly" pill and toasts (lesson screen) */
/* under the lesson header (clear of the nav buttons and the bottom word card) */
/* U3 (spec §7): bottom-right of the bottom card (.panel), under the box. The panel grows while the pill shows. */
#v15ovr {
  position: fixed;
  right: calc((100vw - var(--v15-panel-w)) / 2 + 14px);
  bottom: calc(var(--v15-panel-gap) + 10px + env(safe-area-inset-bottom));
  z-index: 52;
  white-space: nowrap;
}
#v15ovr[hidden] { display: none; }
/* HOTFIX-pill-reflow v2: in a lesson the pill sits in the controls row, over the progress dots (between undo and
   clear), instead of growing the panel. Showing or hiding it never changes layout, so the pad rect never moves. */

    return `<div class="pmain"><div class="pside">${equation(k.src, shownParts, 'full', anim)}</div></div>`;

  const step = box.s;

  const name = part.name ? esc(part.name) : '';

  let text;
  let mode;

    mode = 'full';
    glyph = `<div class="pglyph">${partSVG(k, partIndex)}</div>`;
    text = `<div class="pname">${name}</div>${keywordHTML}`;
  } else {
    const ladderSteps = ladder(k, step);
    const hintsUsed = (box.hints || {})[partIndex] || 0;
    const revealed = (kind) => ladderSteps.indexOf(kind) > -1 && ladderSteps.indexOf(kind) < hintsUsed;
    if (step.t === 'W') {
      mode = revealed('char') ? 'full' : 'none';
      text = '';
    } else {
      mode = revealed('kw') ? 'kw' : 'none';
      const nameHTML = revealed('name') ? `<div class="pname">${name}</div>` : '';
      text = `${nameHTML}${revealed('kw') ? keywordHTML : ''}\n   `;

/* ==================== ANIMATIONS — combine + celebration ==================== */
/** Part ink starts this far (share of its offset from the centre) away from its place in the kanji. */
const COMBINE_SPREAD = 0.5;
/** Centre of the 109-unit KanjiVG box. */
const KANJIVG_CENTRE = 54.5;
/** Extra wait (ms) past the animation before the combine finishes on its own. */
const COMBINE_GRACE_MS = 200;
/** The combine overlay is removed this long (ms) after the final flash starts. */
const COMBINE_OVERLAY_LINGER_MS = FLASH_MS + 300;

/**
 * Parts → kanji: the user's own ink from this kanji's part-alone boxes (mapped back from each part box into kanji
 * coordinates) starts spread apart, glides together and settles into the kanji. Single ink colour, no text. Tap to skip.
 * @param {object} box the last part box of the kanji
 * @param {Function} done called once, when the animation ends or is skipped
 */
function combineParts(box, done) {
  box.combining = true;
  box.b.querySelectorAll('.plab').forEach((label) => label.remove());
  const overlay = document.createElement('div');
  overlay.className = 'combo';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 109 109');
  overlay.appendChild(svg);
  const animations = latestPartBoxes(box).map((partBox) => {
    const group = partInkGroup(partBox);
    svg.appendChild(group);
    return glideIntoPlace(group, box.k.src, partBox.s.pi);
  });
  box.b.appendChild(overlay);
  box.b.classList.add('combining');
  let finished = false;
  const finish = () => {
    if (finished) {
      return;
    }
    finished = true;
    animations.forEach((animation) => animation.finish());
    box.b.classList.remove('combining');
    box.combining = false;
    later(() => overlay.remove(), COMBINE_OVERLAY_LINGER_MS);
    done();
  };
  overlay.addEventListener('pointerdown', (event) => { event.preventDefault(); finish(); });
  later(finish, CONFIG.COMBINE.MS + COMBINE_GRACE_MS);
}

/** Finished part boxes of this kanji, the latest one per part (a repeat replaces the first try). */
function latestPartBoxes(box) {
  const latest = {};
  boxes
    .filter((x) => x.s.t === 'P' && x.s.kc === box.s.kc && x.s.ki === box.s.ki && x.allDone)
    .forEach((x) => { latest[x.s.pi] = x; });
  return Object.values(latest);
}

/** SVG group with a part box's ink, mapped from part-box coordinates back into the kanji's 109 box. */
function partInkGroup(partBox) {
  const transform = partBox.k.xf;
  const toKanji = (point) => {
    const x = ((point.x * 109 - transform.tx) / transform.s).toFixed(1);
    const y = ((point.y * 109 - transform.ty) / transform.s).toFixed(1);
    return `${x} ${y}`;
  };
  const group = document.createElementNS(NS, 'g');
  partBox.pad.strokes.forEach((stroke) => {
    if (stroke.pts.length < 1) {
      return;
    }
    const path = document.createElementNS(NS, 'path');
    const dotTail = stroke.pts.length < 2 ? 'l0 .1' : '';   // a single point still draws as a dot
    path.setAttribute('d', `M${stroke.pts.map(toKanji).join('L')}${dotTail}`);
    path.setAttribute('stroke', CONFIG.INK);
    path.setAttribute('class', 'cstroke');
    group.appendChild(path);
  });
  return group;
}

/** Animate a part's ink group from spread apart into its place in kanji K. */
function glideIntoPlace(group, K, partIndex) {
  const bounds = bbox(K, partIndex);
  const dx = (bounds.x + bounds.w / 2 - KANJIVG_CENTRE) * COMBINE_SPREAD;
  const dy = (bounds.y + bounds.h / 2 - KANJIVG_CENTRE) * COMBINE_SPREAD;
  const spread = `translate(${dx}px,${dy}px)`;
  const home = 'translate(0px,0px)';
  const keyframes = [
    { transform: spread, opacity: 0 },
    { transform: spread, opacity: 1, offset: 0.25 },
    { transform: spread, offset: 0.45 },
    { transform: home, offset: 0.85 },
    { transform: home },
  ];
  return group.animate(keyframes, { duration: CONFIG.COMBINE.MS, easing: 'ease-in-out', fill: 'forwards' });
}

/* Stroke hand-off between boxes. From the moment a box seals (finishBox sets `sliding`) until focus() unlocks the
 * next box, every pad is locked, so a learner who starts the next character right away used to lose that stroke.
 * Now a stroke started on a locked pad in that window is inked normally, buffered on pointerup, and replayed into the
 * newly focused box (same box-relative coordinates) as if it had been drawn there. A sealed look-alike prefix keeps
 * its pad unlocked during the slide delay, so its extra strokes still reach rejectStrokeAfterSeal (B3) unchanged.
 * A part flash in the middle of a box locks the pad the same way; a stroke drawn then is replayed into the same box
 * when the flash ends (finishPart's afterFlash), so the part-flash queue keeps its order. */
const handoffStrokes = [];

 *  after a part flash (finishPart -> afterFlash), or the next box after a box-end flash/slide (focus()). */
function handoffOpen() {
  const box = boxes[cur];
  if (!(sliding || flashing) || !box) return false;
  const sealed = box.allDone || box.pad.strokes.length >= box.k.strokes;
  return !sealed || cur + 1 < boxes.length;   // at lesson end there is no next box: keep dropping as before
}

/** Feed buffered strokes to the current box, oldest first, once it is unlocked (called by focus() and on pointerup). */

    const pad = box.pad;

/* ---- 部首 (components-first) path: every kanji ordered so that kanji used as components come before kanji built from them ---- */
/** Kanji per lesson on the 部首 path. */
const RAD_N = 5;

/**
 * True when every component of `kanji` that is itself a kanji has already been placed.
 * @param {object} kanji DATA.kanji entry
 * @param {Set<string>} placed
 */
function componentsPlaced(kanji, placed) {
  return kanji.parts.every((part) => part.g === kanji.k || !DATA.kanji[part.g] || placed.has(part.g));
}

/**
 * Order all kanji components-first: repeatedly take the fewest-stroke kanji whose kanji-components are placed.
 * @returns {string[]} kanji characters
 */
function componentOrder() {
  const byStrokes = Object.values(DATA.kanji).sort((a, b) => a.strokes - b.strokes || a.k.localeCompare(b.k));
  const placed = new Set();
  const order = [];
  while (order.length < byStrokes.length) {
    const unplaced = byStrokes.filter((kanji) => !placed.has(kanji.k));
    const next = unplaced.find((kanji) => componentsPlaced(kanji, placed)) || unplaced[0];
    placed.add(next.k);
    order.push(next.k);
  }
  return order;
}

/**
 * Practice word for a bare kanji: its first kun (else on) reading in hiragana, without okurigana.
 * @param {object} kanji
 * @returns {{w:string,r:string,m:string}}
 */
function kanjiAsWord(kanji) {
  const reading = (kanji.kun[0] || kanji.on[0] || '').split('.')[0].replace(/-/g, '');
  return { w: kanji.k, r: hira(reading), m: kanji.keyword };
}

/** Build the 部首 lessons ('Building blocks n'), RAD_N kanji each, in componentOrder(). */
function buildRadicalLessons() {
  componentOrder().forEach((char, index) => {
    const number = Math.floor(index / RAD_N) + 1;
    if (index % RAD_N === 0) {
      SETS.push({ id: `R-${number}`, title: `Building blocks ${number}`, level: '部首', n: number, words: [] });
    }
    SETS[SETS.length - 1].words.push(kanjiAsWord(DATA.kanji[char]));
  });
}

/* ---- 復習 review queue: every learned word or kanji whose spaced-review date has passed, interleaved across lessons ---- */

/**
 * Review record for a word: its own record, or (one-kanji words) the kanji's record.
 * @param {string} text word text
 * @returns {object|null}
 */
function reviewRecord(text) {
  const wordRecord = recGet(`w:${text}`);
  if (wordRecord) {
    return wordRecord;
  }
  return text.length === 1 ? recGet(text) : null;
}

/**
 * Shuffle an array in place (Fisher–Yates) so the review interleaves lessons.
 * @param {Array} items
 * @returns {Array} the same array
 */
function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

/**
 * Due words: most overdue first, at most CONFIG.REVIEW_MAX, then shuffled.
 * @returns {object[]} word objects {w,r,m}
 */
function dueWords() {
  const now = Date.now();
  const due = new Map();
  SETS.forEach((set) => set.words.forEach((word) => {
    if (due.has(word.w)) {
      return;
    }
    const record = reviewRecord(word.w);
    const dueAt = record && Date.parse(record.nextReview);
    if (record && record.lastPracticed && dueAt <= now) {
      due.set(word.w, { word, dueAt });
    }
  }));
  const mostOverdue = [...due.values()].sort((a, b) => a.dueAt - b.dueAt).slice(0, CONFIG.REVIEW_MAX);
  return shuffle(mostOverdue.map((entry) => entry.word));
}

/** Open the review queue as a one-off lesson (recall-first: due kanji get their faded steps). */
function openReview() {
  const words = dueWords();
  if (!words.length) {
    return;
  }
  loadLesson({ id: 'review', title: '復習', words, level: pickLv(), custom: true }, { review: true });
}

let curSet = null;
/** Lesson badge tier = lowest mastery tier among its words ('' if any word was never completed). */
function setTier(s){const T=s.words.map(w=>tier(w.w)),M=CONFIG.MASTERY;return T.some(t=>!t)?'':M[Math.min(...T.map(t=>M.indexOf(t)))]}
/** Picker state: expanded lessons and the level tabs. */
const openSets=new Set(),LEVELS=['あ','ア','部首','N5','N4','N3','N2','N1'];

/* ==================== LAZY LEVEL DATA — N4–N1 files listed in levels.js (format: kanji-data/SCHEMA.md) ==================== */

/** Data files that may be loaded on demand, from levels.js. */
const LEVEL_FILES = window.KANJI_LEVEL_FILES || [];

/** Levels whose data has already been merged. */
const loadedLv = new Set();

/**
 * File name for level `level` if levels.js lists one.
 * @param {string} level e.g. 'N4'
 * @returns {string|undefined}
 */
const levelFile = (level) => LEVEL_FILES.find((file) => file === `data-${level}.js`);

/**
 * Merge a registered level (window.KANJI_LEVELS[level]) into DATA, SETS and the search list. Safe to call twice.
 * @param {string} level
 */
function mergeLevel(level) {
  const registered = (window.KANJI_LEVELS || {})[level];
  if (!registered || loadedLv.has(level)) {
    return;
  }
  loadedLv.add(level);
  Object.assign(DATA.kanji, registered.kanji || {});
  Object.assign(DATA.chars, registered.chars || {});
  Object.assign(window.MEMORY_LINKS, registered.links || {});
  // links.js is the authority for component keywords: a level file only adds keywords it does not have yet
  Object.entries(registered.componentKw || {}).forEach(([component, keyword]) => {
    if (!(component in window.COMPONENT_KW)) {
      window.COMPONENT_KW[component] = keyword;
    }
  });
  const sets = (registered.level && registered.level.sets) || [];
  sets.forEach((set, index) => {
    SETS.push({ ...set, level, n: index + 1 });
    set.words.forEach((word) => {
      if (!ALLWORDS.some((known) => known.w === word.w)) {
        ALLWORDS.push(word);
      }
    });
  });
}

/** Script URLs already requested by loadScriptOnce(). */
const requestedScripts = new Map();

/** Load a script at most once; later calls share the first request. */
function loadScriptOnce(url) {
  if (!requestedScripts.has(url)) {
    requestedScripts.set(url, loadScript(url));
  }
  return requestedScripts.get(url);
}

/**
 * Load one script by URL (a script tag works from file:// and from the service-worker cache).
 * @param {string} url
 * @returns {Promise<boolean>} true when it loaded
 */
function loadScript(url) {
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = url;
    script.onload = () => resolve(true);
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}

/**
 * Load level `level` once: its data file, then its memory-link file (links-<level>.js) if levels.js lists one.
 * @param {string} level
 * @returns {Promise<boolean>} false only when the data file failed to load
 */
async function ensureLevel(level) {
  const file = levelFile(level);
  if (!file || loadedLv.has(level)) {
    return true;
  }
  const loaded = await loadScript(file);
  if (!loaded) {
    return false;
  }
  mergeLevel(level);
  const linkFile = (window.KANJI_LINK_FILES || []).find((name) => name === `links-${level}.js`);
  const sentenceFile = (window.KANJI_SENTENCE_FILES || []).find((name) => name === `sentences-${level}.js`);
  const topologyFile = (window.STROKE_TOPOLOGY_FILES || []).find((name) => name === `stroke-topology-${level}.js`);
  if (topologyFile) {
    loadScriptOnce(topologyFile);   // contact checks join in once it arrives
  }
  if (sentenceFile) {
    loadScript(sentenceFile);   // example sentences are optional: shown once they arrive
  }
  if (linkFile) {
    await loadScript(linkFile);   // merges into the links.js objects; a missing file is harmless
  }
  return true;
}

/* ---------- Quiz banks (placement / level / unit tests, reading stages of the rank) ---------- */

/** Most words offered per quiz item. */
const QUIZ_MAX_WORDS = 4;
/** Choices shown in a multiple-choice question, the answer included. */
const QUIZ_CHOICES = 4;
/** Level order used to keep quiz words at or below the item's level. */
const QUIZ_LEVEL_ORDER = ['kana', 'N5', 'N4', 'N3', 'N2', 'N1'];

/**
 * Load the quiz bank of `level` ('kana', 'N5' … 'N1') once.
 * @param {string} level
 * @returns {Promise<boolean>} true when the bank is available
 */
async function ensureQuizBank(level) {
  const file = (window.QUIZ_BANK_FILES || []).find((name) => name === `quiz-${level}.js`);
  if (!file) {
    return false;
  }
  return loadScriptOnce(file);
}

/** Quiz item of one character, or null until its bank has loaded. */
function quizItem(char) {
  return (window.QUIZ_BANKS && window.QUIZ_BANKS[char]) || null;
}

/** True when a word only uses kanji at or below `level` (the bank lists higher ones in aboveLevel). */
function quizWordInLevel(word, level) {
  const limit = QUIZ_LEVEL_ORDER.indexOf(level);
  return !(word.aboveLevel || []).some((entry) => {
    const entryLevel = typeof entry === 'string' ? (quizItem(entry) || {}).level : entry.level;
    return !entryLevel || QUIZ_LEVEL_ORDER.indexOf(entryLevel) > limit;
  });
}

/**
 * Reading words for `char`: JMdict common words (the bank holds only those), in-level words first, bank order kept.
 * @param {string} char
 * @param {number} [max]
 */
function quizWords(char, max = QUIZ_MAX_WORDS) {
  const item = quizItem(char);
  if (!item || !item.words) {
    return [];
  }
  const inLevel = item.words.filter((word) => word.common !== false && quizWordInLevel(word, item.level));
  const rest = item.words.filter((word) => !inLevel.includes(word));
  return [...inLevel, ...rest].slice(0, max);
}

/**
 * Is `answer` an accepted reading of `char`? Kana answers are compared as hiragana without dots;
 * a bare kun stem counts only when the okurigana is shown in the prompt.
 * @param {string} char
 * @param {string} answer
 * @param {boolean} [okuriganaShown]
 */
function quizReadingAccepted(char, answer, okuriganaShown = false) {
  const item = quizItem(char);
  if (!item) {
    return false;
  }
  const typed = normalizeSearchQuery(answer).replace(/[-\s]/g, '');
  return item.reading.accepted.some((entry) => {
    if (entry.type === 'kun-stem' && !okuriganaShown) {
      return false;
    }
    return normalizeSearchQuery(entry.r) === typed;
  });
}

/** Is `answer` an accepted English meaning of `char` (case-insensitive, surrounding "to " ignored)? */
function quizMeaningAccepted(char, answer) {
  const item = quizItem(char);
  if (!item || !item.meaning) {
    return false;
  }
  const clean = (text) => String(text).normalize('NFKC').trim().toLowerCase().replace(/^to\s+/, '');
  const typed = clean(answer);
  return typed.length > 0 && item.meaning.accepted.some((entry) => clean(entry.a) === typed);
}

/**
 * Multiple-choice characters for `char`: the answer plus in-level distractors in bank order
 * (confusables first), then above-level ones; display-only extras are skipped. Shuffled.
 * @param {string} char
 * @param {number} [count]
 */
function quizChoices(char, count = QUIZ_CHOICES) {
  const item = quizItem(char);
  if (!item) {
    return [char];
  }
  const usable = (item.distractors || []).filter((entry) => !entry.notInLevels);
  const ordered = [...usable.filter((entry) => !entry.aboveLevel), ...usable.filter((entry) => entry.aboveLevel)];
  const picks = ordered.slice(0, count - 1).map((entry) => entry.c);
  return shuffle([char, ...picks]);
}

/** Display order of practice-set kinds inside a level group, with their headings. */
const PRACTICE_KIND_LABELS = {

/** Display order of level groups. */

/* ---- search: all bundled words + kanji by kanji, kana reading or English meaning ---- */
const I_SRCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
let searching=false,sQuery='';
/** Every bundled word once. A word's own lesson entry wins over its 部首 (building-block) entry, which carries a
 *  kanji reading instead of the word's. */
const ALLWORDS = (() => {
  const byText = new Map();
  const ordered = [...SETS.filter((set) => set.level !== '部首'), ...SETS.filter((set) => set.level === '部首')];
  ordered.flatMap((set) => set.words).forEach((word) => {

/* ---- search index (kanji-data/SEARCH_INDEX.md; ranking mirrors kanji-data/search_reference.py) ---- */

/** Prefix matches count only for queries at least this long, and only when nothing matches exactly. */
const SEARCH_MIN_PREFIX = 3;
/** term → [[char, kind, position]], rebuilt when more index files have arrived. */
let searchLookup = null;
let searchLookupSize = -1;

/** True when every character is hiragana, katakana or the long-vowel mark. */
const isAllKana = (text) => text.length > 0 && /^[\u3041-\u3096\u30a1-\u30fa\u30fc]+$/.test(text);

/** Query normalized as the reference does: NFKC, trim, lower-case; all-kana queries lose dots and become hiragana. */
function normalizeSearchQuery(query) {
  const text = String(query || '').normalize('NFKC').trim().toLowerCase();
  const stripped = text.replace(/[.・]/g, '');
  return isAllKana(stripped) ? hira(stripped) : text;
}

/**
 * True when Botthree's index flags a term as a weak match (4th term field, e.g. 'loose' or {loose:true});
 * such hits are listed under a "Loose matches" label. Absent flag = a normal match.
 */
function isLooseQuality(quality) {
  if (!quality) {
    return false;
  }
  if (typeof quality === 'object') {
    return Boolean(quality.loose || quality.weak || quality.quality === 'loose' || quality.quality === 'weak');
  }
  return /loose|weak/i.test(String(quality));
}

/** Reviewed stretched senses (query → kanji) listed as loose: SEARCH_INDEX.looseSenses. */
const LOOSE_SENSES = {};
/** English-tier score above this is a loose match (SEARCH_INDEX.md, Confidence). */
const LOOSE_SCORE = 7;
/** Characters whose best match in the last searchIndex() call was a loose one. */
let searchLooseChars = new Set();
/** False when every result of the last searchIndex() call was loose. */
let searchHasCloseMatch = true;
/** Characters matched only through a component keyword in the last searchIndex() call. */
let searchComponentChars = new Set();
/** Kanji-row slots kept for component matches, so "tree" still lists 本, 来 … after many "tree" meanings. */
const SEARCH_COMPONENT_SLOTS = 8;

/** The term lookup over every loaded index file. */
function searchIndexLookup() {
  const chars = (window.SEARCH_INDEX && window.SEARCH_INDEX.chars) || {};
  const size = Object.keys(chars).length;
  if (searchLookup && size === searchLookupSize) {
    return searchLookup;
  }
  searchLookup = new Map();
  searchLookupSize = size;
  Object.entries(chars).forEach(([char, entry]) => {
    const positions = {};
    entry.terms.forEach(([term, kind, source, quality]) => {
      const position = positions[kind] || 0;
      positions[kind] = position + 1;
      if (!searchLookup.has(term)) {
        searchLookup.set(term, []);
      }
      searchLookup.get(term).push([char, kind, position, source || '', isLooseQuality(quality)]);
    });
  });
  return searchLookup;
}

/** Rank tier of each term kind (SEARCH_INDEX.md, reference ranking revised 2026-10-22). */
const SEARCH_TIERS = { char: 0, meaning: 1, keyword: 1, synonym: 1, reading: 2, romaji: 3, component: 4 };
/** English match quality: lower is better. */
const MATCH_QUALITY = { primary: 0, firstGloss: 1, variant: 2.5, gloss: 3, bareGloss: 3.5 };
/** Later KANJIDIC2 meanings are weaker: base + step per position, capped. */
const MEANING_BASE = 1;
const MEANING_STEP = 0.3;
const MEANING_MAX = 2.5;
/** Extra cost of a sense-restricted KANJIDIC2 meaning, e.g. 'issue (offspring)'. */
const QUALIFIED_PENALTY = 1;
/** Reviewed top results for polysemous English queries: SEARCH_INDEX.preferredTops (kanji-data/search_overrides.py). */
const PREFERRED_TOPS = {};
/** Bonus per extra okurigana word giving the same first gloss (閉める, 閉じる), capped. */
const SUPPORT_BONUS = 0.25;
const SUPPORT_MAX = 0.75;
/** Commonness weights: per JLPT step, and scaled newspaper frequency up to FREQ_CAP. */
const LEVEL_WEIGHT = 0.5;
const FREQ_WEIGHT = 0.5;
const FREQ_CAP = 2500;

/** 0 for the most common characters, up to about 3.5 for rare N1 kanji. */
function searchCommonness(entry, levels) {
  const grade = entry.grade || 0;
  let penalty = 0.5;
  if (entry.level === 'kana' || (grade >= 1 && grade <= 6)) {
    penalty = 0;
  } else if (grade === 8) {
    penalty = 0.25;
  }
  const freq = Math.min(entry.freq, FREQ_CAP) / FREQ_CAP;
  return LEVEL_WEIGHT * levels.indexOf(entry.level) + FREQ_WEIGHT * freq + penalty;
}

/** Best quality among the sources of a synonym term ('JMdict <id> <word> gloss <n>; synonym table (…)'). */
function glossQuality(source) {
  let best = 9;
  let firstGlosses = 0;
  source.split('; ').forEach((part) => {
    if (part.startsWith('synonym table')) {
      best = Math.min(best, MATCH_QUALITY.variant);
      return;
    }
    if (!part.startsWith('JMdict')) {
      return;
    }
    const [, , word, , number] = part.split(' ');
    if ([...word].length === 1) {
      best = Math.min(best, MATCH_QUALITY.bareGloss);
    } else if (number === '1') {
      firstGlosses += 1;
      best = Math.min(best, MATCH_QUALITY.firstGloss);
    } else {
      best = Math.min(best, MATCH_QUALITY.gloss);
    }
  });
  if (firstGlosses > 1) {
    best -= Math.min(SUPPORT_BONUS * (firstGlosses - 1), SUPPORT_MAX);
  }
  return best;
}

/** Quality of an English match: primary 0, later KANJIDIC2 meanings 1.0–2.0, synonyms by gloss. */
function matchQuality(kind, position, source) {
  const penalty = source.includes('qualified:') ? QUALIFIED_PENALTY : 0;
  if (kind === 'keyword' || (kind === 'meaning' && position === 0)) {
    return MATCH_QUALITY.primary + penalty;
  }
  if (kind === 'meaning') {
    return Math.min(MEANING_BASE + MEANING_STEP * (position - 1), MEANING_MAX) + penalty;
  }
  return glossQuality(source);
}

/** Sort key of one match: tier, score (English: quality + commonness; else level), position, frequency, code point. */
function searchRankKey(char, kind, position, source = '') {
  const index = window.SEARCH_INDEX;
  const entry = index.chars[char];
  const tier = SEARCH_TIERS[kind] ?? 9;
  let score = index.levels.indexOf(entry.level);
  if (tier === 1) {
    const raw = matchQuality(kind, position, source) + searchCommonness(entry, index.levels);
    score = Math.round(raw * 1e6) / 1e6;
  }
  return [tier, score, position, entry.freq, char.codePointAt(0)];
}

/** Compare two rank keys element by element. */
function compareRankKeys(a, b) {
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) {
      return a[i] - b[i];
    }
  }
  return 0;
}

/**
 * Characters (kanji and kana) for a query from the search index, best first; [] until an index file has loaded.
 * @param {string} query
 * @param {number} [limit]
 * @returns {string[]}
 */
function searchIndex(query, limit = SEARCH_RESULT_CAP) {
  if (!window.SEARCH_INDEX) {
    return [];
  }
  const lookup = searchIndexLookup();
  const raw = String(query || '').trim();
  const text = normalizeSearchQuery(query);
  const best = new Map();
  const loose = new Map();
  const consider = (char, kind, position, source, isLoose = false) => {
    const key = searchRankKey(char, kind, position, source);
    if (!best.has(char) || compareRankKeys(key, best.get(char)) < 0) {
      best.set(char, key);
      loose.set(char, isLoose);
    }
  };
  [...(lookup.get(text) || []), ...(lookup.get(raw) || [])].forEach(([char, kind, position, source, isLoose]) => {
    if (kind !== 'char' || char === raw) {
      consider(char, kind, position, source, isLoose);
    }
  });
  const prefixOnly = !best.size && [...text].length >= SEARCH_MIN_PREFIX;
  if (prefixOnly) {
    lookup.forEach((hits, term) => {
      if (term.startsWith(text)) {
        hits.filter(([, kind]) => kind !== 'char').forEach(([char, kind, position, source, isLoose]) => consider(char, kind, position, source, isLoose));
      }
    });
  }
  const tops = window.SEARCH_INDEX.preferredTops || PREFERRED_TOPS;
  const preferredEntry = tops[text];
  const preferred = Array.isArray(preferredEntry) ? preferredEntry[0] : preferredEntry;
  if (preferred && best.has(preferred) && best.get(preferred)[0] === SEARCH_TIERS.meaning) {
    best.set(preferred, [SEARCH_TIERS.meaning, -1, ...best.get(preferred).slice(2)]);
  }
  const ordered = [...best.keys()].sort((a, b) => compareRankKeys(best.get(a), best.get(b))).slice(0, limit);
  const senses = window.SEARCH_INDEX.looseSenses || LOOSE_SENSES;
  const isLooseResult = (char) => {
    const [tier, score] = best.get(char);
    if (prefixOnly || tier === SEARCH_TIERS.component || loose.get(char)) {
      return true;
    }
    const stretched = senses[text];
    const listed = stretched && (typeof stretched === 'string' || Array.isArray(stretched) ? stretched.includes(char) : char in stretched);
    const looseScore = window.SEARCH_INDEX.looseScore ?? LOOSE_SCORE;
    return tier === SEARCH_TIERS.meaning && (score > looseScore || Boolean(listed));
  };
  ordered.forEach((char) => loose.set(char, isLooseResult(char)));
  searchLooseChars = new Set(ordered.filter((char) => loose.get(char)));
  searchHasCloseMatch = ordered.some((char) => !loose.get(char));
  searchComponentChars = new Set(ordered.filter((char) => best.get(char)[0] === SEARCH_TIERS.component));
  // strong matches first, loose ones after them (rendered under their own label)
  return [...ordered.filter((char) => !loose.get(char)), ...ordered.filter((char) => loose.get(char))];
}

/** Toggle search. All levels are loaded in the background so search covers N5–N1; results refresh as they arrive. */
function openSearch() {
  searching = !searching;
  renderPicker();
  if (!searching) {
    return;
  }
  if ($('sq')) {
    $('sq').focus();   // synchronously inside the tap handler, or iPad Safari won't raise the keyboard
  }
  history.pushState({ search: true }, '');   // the browser Back button leaves search, not the app
  const indexFiles = (window.SEARCH_INDEX_FILES || []).map((file) => loadScriptOnce(file));
  const levels = LEVELS.filter((level) => levelFile(level)).map((level) => ensureLevel(level));
  Promise.all([...indexFiles, ...levels]).then(() => {
    if (searching) {
      renderResults();
    }
  });
}
/** Most results shown per list. */
const SEARCH_RESULT_CAP = 30;
/** Queries longer than this many characters match nothing (no word or meaning is that long; keeps typing instant on pasted text). */
const SEARCH_MAX_QUERY = 64;
/** Match quality, best first: lower ranks are listed first. */
const RANK = { exact: 0, reading: 1, word: 2, prefix: 3, partial: 4, component: 5 };

/** Romaji → hiragana for latin queries such as "hito" (Hepburn, enough for readings). */
const ROMAJI = [
  ['kya', 'きゃ'], ['kyu', 'きゅ'], ['kyo', 'きょ'], ['sha', 'しゃ'], ['shu', 'しゅ'], ['sho', 'しょ'], ['chi', 'ち'],
  ['cha', 'ちゃ'], ['chu', 'ちゅ'], ['cho', 'ちょ'], ['nya', 'にゃ'], ['nyu', 'にゅ'], ['nyo', 'にょ'], ['hya', 'ひゃ'],
  ['hyu', 'ひゅ'], ['hyo', 'ひょ'], ['mya', 'みゃ'], ['myu', 'みゅ'], ['myo', 'みょ'], ['rya', 'りゃ'], ['ryu', 'りゅ'],
  ['ryo', 'りょ'], ['gya', 'ぎゃ'], ['gyu', 'ぎゅ'], ['gyo', 'ぎょ'], ['ja', 'じゃ'], ['ju', 'じゅ'], ['jo', 'じょ'],
  ['bya', 'びゃ'], ['byu', 'びゅ'], ['byo', 'びょ'], ['pya', 'ぴゃ'], ['pyu', 'ぴゅ'], ['pyo', 'ぴょ'], ['shi', 'し'],
  ['tsu', 'つ'], ['ji', 'じ'], ['fu', 'ふ'],
  ...'ka:か ki:き ku:く ke:け ko:こ sa:さ su:す se:せ so:そ ta:た te:て to:と na:な ni:に nu:ぬ ne:ね no:の ha:は hi:ひ he:へ ho:ほ ma:ま mi:み mu:む me:め mo:も ya:や yu:ゆ yo:よ ra:ら ri:り ru:る re:れ ro:ろ wa:わ wo:を ga:が gi:ぎ gu:ぐ ge:げ go:ご za:ざ zu:ず ze:ぜ zo:ぞ da:だ de:で do:ど ba:ば bi:び bu:ぶ be:べ bo:ぼ pa:ぱ pi:ぴ pu:ぷ pe:ぺ po:ぽ a:あ i:い u:う e:え o:お'
    .split(' ').map((pair) => pair.split(':')),
];

/** Hiragana for a romaji query, or '' when it is not all romaji. */
function romajiToHiragana(text) {
  if (!/^[a-z]+$/.test(text)) {
    return '';
  }
  let out = '';
  let rest = text;
  while (rest) {
    if (rest.length > 1 && rest[0] === rest[1] && rest[0] !== 'n') {
      out += 'っ';
      rest = rest.slice(1);
      continue;
    }
    const hit = ROMAJI.find(([latin]) => rest.startsWith(latin));
    if (hit) {
      out += hit[1];
      rest = rest.slice(hit[0].length);
    } else if (rest[0] === 'n') {
      out += 'ん';
      rest = rest.slice(1);
    } else {
      return '';
    }
  }
  return out;
}

/** A reading reduced for comparison: hiragana, without okurigana marks, brackets or hyphens. */
const plainReading = (reading) => hira(reading).replace(/[.\-‐()（）\s]/g, '');

/** Query forms: lowercase text, its English words, and kana for reading matches (from kana or romaji). */
function parseQuery(raw) {
  let text = String(raw || '').replace(/[\s\u3000]+/g, ' ').trim().toLowerCase().slice(0, SEARCH_MAX_QUERY);
  if (text.length > 1 && /^(.)\1+$/u.test(text)) {
    text = [...text][0];   // 人人人… (a held key or paste) searches for 人
  }
  const kana = plainReading(text);
  return {
    text,
    words: text.split(' ').filter(Boolean),
    kana: /^[\u3041-\u3096\u30fc]+$/.test(kana) ? kana : romajiToHiragana(text.replace(/[\s']/g, '')),
  };
}

/** Best rank of an English gloss list against the query (every query word must appear), or null. */
function meaningRank(meanings, query) {
  const glosses = meanings.map((m) => m.toLowerCase());
  if (glosses.some((g) => g === query.text)) {
    return RANK.word;
  }
  if (query.words.every((w) => glosses.some((g) => g.split(/[\s,;()]+/).some((part) => part.startsWith(w))))) {
    return RANK.prefix;
  }
  if (query.words.every((w) => glosses.some((g) => g.includes(w)))) {
    return RANK.partial;
  }
  return null;
}

/** Rank of kanji k for the query, or null when it does not match. */
function kanjiRank(k, query) {
  if (k.k === query.text) {
    return RANK.exact;
  }
  if ([...query.text].includes(k.k)) {
    return RANK.prefix;   // a kanji inside a typed compound, e.g. 日本
  }
  if (query.kana) {
    const readings = [...k.on, ...k.kun].map(plainReading);
    const stems = k.kun.map((r) => plainReading(r.split('.')[0]));
    if (readings.includes(query.kana) || stems.includes(query.kana)) {
      return RANK.reading;
    }
    if (readings.some((r) => r.startsWith(query.kana)) && query.kana.length > 1) {
      return RANK.partial;
    }
  }
  const byMeaning = meaningRank([k.keyword, ...k.meanings], query);
  if (byMeaning !== null) {
    return byMeaning;
  }
  return componentRank(k, query);
}

/** Matches on the kanji's radical or component keywords (氵, "water" …), or null. */
function componentRank(k, query) {
  const radical = k.radical || {};
  const keywords = (k.parts || []).map((part) => part.kw || (window.COMPONENT_KW || {})[part.g] || '');
  const glyphs = [radical.glyph, ...(k.parts || []).map((part) => part.g)];
  if (glyphs.includes(query.text)) {
    return RANK.component;
  }
  const names = [radical.meaning || '', ...keywords].filter(Boolean);
  return names.length && meaningRank(names, query) !== null ? RANK.component : null;
}

/** Rank of a word for the query, or null. */
function wordRank(word, query) {
  if (word.w === query.text) {
    return RANK.exact;
  }
  const reading = plainReading(word.r);
  if (query.kana && reading === query.kana) {
    return RANK.reading;
  }
  if (word.w.includes(query.text)) {
    return RANK.prefix;
  }
  if (query.kana && reading.startsWith(query.kana)) {
    return RANK.partial;
  }
  if (query.kana.length > 1 && reading.includes(query.kana)) {
    return RANK.component;   // e.g. じん inside がいこくじん
  }
  return meaningRank(word.m.split(/;/), query);
}

/** Items that match, best rank first (stable within a rank). */
function rankedMatches(items, rankOf) {
  return items
    .map((item, order) => ({ item, order, rank: rankOf(item) }))
    .filter((hit) => hit.rank !== null)
    .sort((a, b) => a.rank - b.rank || a.order - b.order)
    .map((hit) => hit.item);
}

/**
 * Search every loaded word and kanji (N5–N1 and kana once loaded) by kanji, English meaning (partial, any case,
 * any word order), on/kun reading in hiragana, katakana or romaji with or without okurigana, kana, and radical
 * or component keyword. Exact matches come first.
 * @param {string} raw the typed query
 * @returns {{words: object[], kanji: object[], more: boolean}} more: some matches were cut at SEARCH_RESULT_CAP
 */
function searchAll(raw) {
  const query = parseQuery(raw);
  if (!query.text) {
    return { words: [], kanji: [], more: false };
  }
  if ([...String(raw).trim()].length > SEARCH_MAX_QUERY) {
    return { words: [], kanji: [], more: false };   // nothing can equal or contain a query this long
  }
  const ranked = searchIndex(raw, SEARCH_RESULT_CAP * 4);
  const indexedKana = ranked.filter((c) => !DATA.kanji[c])
    .map((c) => ALLWORDS.find((word) => word.w === c)).filter(Boolean);   // kana practice entries, e.g. "tsu" → つ
  const words = [...indexedKana, ...rankedMatches(ALLWORDS, (word) => wordRank(word, query))
    .filter((word) => !indexedKana.includes(word))];
  const indexed = ranked.filter((c) => DATA.kanji[c]).map((c) => DATA.kanji[c]);
  // the app's own matcher only fills in when the index has nothing (multi-word AND queries, index not loaded yet)
  const fallback = indexed.length ? [] : rankedMatches(Object.values(DATA.kanji), (k) => kanjiRank(k, query))
    .filter((k) => !indexed.includes(k));
  const merged = [...indexed, ...fallback];   // the index ranking first; the app's own matcher adds multi-word queries
  const viaComponent = merged.filter((k) => searchComponentChars.has(k.k)).slice(0, SEARCH_COMPONENT_SLOTS);
  const direct = merged.filter((k) => !viaComponent.includes(k));
  const keepSlots = merged.length > SEARCH_RESULT_CAP && merged.indexOf(viaComponent[viaComponent.length - 1]) >= SEARCH_RESULT_CAP;
  const room = SEARCH_RESULT_CAP - viaComponent.length;
  const kanji = keepSlots ? [...direct.slice(0, room), ...viaComponent, ...direct.slice(room)] : merged;
  return {
    words: words.slice(0, SEARCH_RESULT_CAP),
    kanji: kanji.slice(0, SEARCH_RESULT_CAP),
    more: words.length > SEARCH_RESULT_CAP || kanji.length > SEARCH_RESULT_CAP,
  };
}
/** Search results: word rows (each with its kanji), then a row of matching kanji; a hint when the list was cut. */
function renderResults() {
  const el = $('sres');
  if (!el) {
    return;
  }
  if (!sQuery.trim()) {
    el.innerHTML = '';
    return;
  }
  const { words, kanji, more } = searchAll(sQuery);
  const kanjiChip = (k) => `<button class="jp kc" onclick="practiceKanji('${k.k}')"><span>${k.k}</span>`
    + `<small>${esc(k.keyword)}</small></button>`;
  const wordRow = (w) => {
    const chips = [...w.w].filter((c) => DATA.kanji[c]).map((c) => kanjiChip(DATA.kanji[c])).join('');
    return `<div class="srow"><button class="jp sw tier ${tier(w.w)}" onclick="openWord('${esc(w.w)}')">`
      + `<span>${esc(w.w)}<em>${esc(w.r)}</em></span><small>${esc(w.m.split(';')[0])}</small></button>${chips}</div>`;
  };
  const strong = kanji.filter((k) => !searchLooseChars.has(k.k));
  const weak = kanji.filter((k) => searchLooseChars.has(k.k));
  const kanjiRow = (strong.length ? `<div class="srow kon">${strong.map(kanjiChip).join('')}</div>` : '')
    + (weak.length ? `<div class="slabel">${strong.length ? 'Loose matches' : 'No close match — loose matches'}</div><div class="srow kon loose">${weak.map(kanjiChip).join('')}</div>` : '');
  const hint = more ? `<div class="smore">Showing the first ${SEARCH_RESULT_CAP} matches — type more to refine</div>` : '';
  el.innerHTML = words.map(wordRow).join('') + kanjiRow + hint || '<div class="soon">No matches</div>';
}

/** Empty the search box and its results, keeping the keyboard up. */
function clearSearch() {
  sQuery = '';
  const input = $('sq');
  if (input) {
    input.value = '';
    input.focus();
  }
  renderResults();
}

/** Open a word from search in its own lesson when it belongs to one, else as a one-word lesson. */
function openWord(word) {
  const set = SETS.find((s) => s.words.some((w) => w.w === word));
  if (!set) {
    practiceWord(word);
    return;
  }
  searching = false;
  pickWord(set.id, set.words.findIndex((w) => w.w === word));
}
/** Practise one word from search: a one-word lesson (kanji flow for new/due kanji + word box). */
function practiceWord(w){const W=ALLWORDS.find(x=>x.w===w);loadLesson({id:'q:'+w,title:w,words:[W],level:pickLv(),custom:true})}
/** Practise only one character's flow (a–h), forced even if it is not due. */
function practiceKanji(c){const k=DATA.kanji[c],r=hira((k.kun[0]||k.on[0]||'').split('.')[0].replace(/-/g,''));loadLesson({id:'k:'+c,title:c,words:[{w:c,r,m:k.keyword}],level:pickLv(),custom:true},{force:true,kanjiOnly:true})}
/** Expand/collapse one lesson in the picker (class toggle only, so the transition runs). */
function toggleSet(id){const el=$('klist').querySelector(`.setw[data-id="${id}"]`);openSets.has(id)?openSets.delete(id):openSets.add(id);el.classList.toggle('open',openSets.has(id))}
/** Jump to word wi of lesson id (loading that lesson first if needed). */
function pickWord(id,wi){$('klist').classList.remove('show');if(!curSet||curSet.id!==id)loadSet(id,wi);else restartAt(wi)}
/** Prev/next hover pill content: the neighbouring word with reading + meaning. */
function peekHTML(it){if(!it)return '';const w=it.w;return `<b>${esc(w.w)}</b><small>${esc(w.r)}<em>${esc(w.m.split(';')[0])}</em></small>`}
function renderPeek(){const ki=steps[cur]?steps[cur].ki:0,n=D.length;$('peekp').innerHTML=peekHTML(D[ki-1]);$('peekn').innerHTML=peekHTML(D[ki+1]);$('prev').disabled=ki<=0;$('next').disabled=ki>=n-1}
/** Picker closes on Escape, on a tap outside it, and on rotation/resize. */
/** Close the picker; a dismissed search starts empty next time. */
const closePicker = () => {
  $('klist').classList.remove('show');
  sQuery = '';
};
addEventListener('keydown',e=>{if(e.key==='Escape'){closePicker();closeEnd()}});
addEventListener('popstate', () => { closePicker(); searching = false; });addEventListener('orientationchange',closePicker);
let lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth!==lastW){lastW=innerWidth;closePicker()}});
document.addEventListener('pointerdown',e=>{const k=$('klist');if(k.classList.contains('show')&&!k.contains(e.target)&&!e.target.closest('#kchip'))closePicker()},true);
/* hover (mouse or Apple Pencil hover) expands the prev/next pill; touch has no hover → plain tap */
['prev','next'].forEach(id=>{const b=$(id);b.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')b.classList.add('peeking')});
 b.addEventListener('pointerleave',()=>b.classList.remove('peeking'));b.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')b.classList.remove('peeking')})});
/** Full reset of lesson state: bumps `gen` (cancels every pending timer/animation callback), stops speech, removes
 *  overlays/petals/seal, clears session tallies and locks. build() then makes brand-new boxes and canvases. */
function resetLesson(){gen++;closeEnd();handoffStrokes.length=0;sliding=flashing=false;try{speechSynthesis.cancel()}catch(_){}
 document.querySelectorAll('.combo,.petal,.ring,.spark').forEach(e=>e.remove());$('seal').classList.remove('show');
 boxes.forEach(x=>{x.pad.locked=true;x.pad.strokes=[];x.pad.cur=null;x.pad.fade=null});boxes=[];Object.keys(sess).forEach(x=>delete sess[x])}
/** Start lesson object L (a SETS entry or a custom search lesson) fresh at word wi. opts → makeSteps (force, kanjiOnly). */
function loadLesson(L,opts={},wi=0){resetLesson();curSet=L;lessonOpts=opts;if(!L.custom){openSets.clear();openSets.add(L.id);localStorage.setItem('set',L.id)}
 D=L.words.map(w=>({k:w.w,w}));makeSteps({...opts,freshKi:opts.review?-1:wi});cur=Math.max(0,steps.findIndex(x=>x.ki===wi));$('klist').classList.remove('show');searching=false;build();requestAnimationFrame(()=>layout())}
let lessonOpts={};
/** Re-enter word wi of the current lesson from scratch (prev/next/picker). */

if(window.V15)V15.migrateOnce(localStorage,new Date().toISOString()); // v15: ranks from the old tint (rec:w:<k>.done), once

$('tspk').innerHTML=I_SPK;$('tspk').addEventListener('click',e=>{e.stopPropagation();speak(curReading())}); // direct gesture → speak
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js'); // offline cache (see sw.js)
