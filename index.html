.scard textarea:focus{box-shadow:inset 0 0 0 2px var(--indigo2)}
.scard .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}
.cta{border:none;border-radius:24px;height:48px;padding:0 26px;background:linear-gradient(180deg,#8a9e6e,#5d7148);color:#fff;font:600 15px var(--ui);box-shadow:0 6px 18px rgba(79,97,64,.35);cursor:pointer;display:inline-flex;align-items:center;gap:8px}

/* toast + celebration */
.toast{position:fixed;left:50%;top:168px;transform:translateX(-50%) translateY(-10px);background:rgba(28,28,36,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
.petal{position:fixed;z-index:25;pointer-events:none;width:12px;height:9px;border-radius:60% 0 60% 0;animation:fall var(--t) cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

.seal em{font:600 11px var(--ui);font-style:normal;color:var(--indigo);margin-top:6px;letter-spacing:.02em}
.seal.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}

 if(wasReview&&sessHints>0)iv=S[0];else{const i=S.indexOf(r.intervalDays);iv=r.intervalDays?S[Math.min(i+1,S.length-1)]:S[0]}

  let px=P[0].x,py=P[0].y;
  for(let i=1;i<P.length-1;i++){const mx=(P[i].x+P[i+1].x)/2,my=(P[i].y+P[i+1].y)/2;c.lineWidth=this.width(s,P[i].p)*tw(i);c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(P[i].x,P[i].y,mx,my);c.stroke();px=mx;py=my}

 redraw(){this.ctx.clearRect(0,0,this.cv.width,this.cv.height);this.strokes.forEach(s=>this.drawStroke(s));if(this.cur&&this.cur.pts.length)this.drawStroke(this.cur);
